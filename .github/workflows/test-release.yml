name: Test Release to Test PyPI

on:
  workflow_call:
    outputs:
      version:
        description: "Package version"
        value: ${{ jobs.build.outputs.version }}
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.check-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install UV
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install build dependencies
        run: uv pip install --system build twine tomli

      # We want to keep this build stage *separate* from the release stage, so that there is no
      # sharing of permissions between them. The release stage has repo contents write access and
      # the PyPI token; keeping that scope limited means a malicious `build` step (e.g. via a
      # compromised dependency) cannot reach our credentials.
      - name: Build project for distribution
        run: python -m build

      - name: Check built package
        run: python -m twine check dist/*

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: test-dist
          path: dist/

      - name: Check Version
        id: check-version
        shell: bash
        run: |
          VERSION=$(python -c "
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

  publish-test-pypi:
    needs:
      - build
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          verbose: true
          print-hash: true
          # We overwrite any existing distribution with the same name and version.
          # This is *only for CI use* and is *extremely dangerous* otherwise!
          skip-existing: true
          attestations: false

  validate-test-pypi:
    needs:
      - build
      - publish-test-pypi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      # We explicitly *don't* set up caching here, so these checks are maximally sensitive to
      # breakage: a cached dependency the manifest no longer declares would let a broken package
      # pass, and then fail in the real world on the missing requirement.

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        uses: astral-sh/setup-uv@v3

      - name: Upgrade setuptools with UV
        run: uv pip install --system "setuptools>=40.8.0" wheel

      - name: Install from Test PyPI
        env:
          VERSION: ${{ needs.build.outputs.version }}
        # Regular PyPI stays the PRIMARY index so dependencies resolve normally; Test PyPI is an
        # extra index carrying only the version under test. Test PyPI can lag, hence the retries.
        run: scripts/pip_install_retry.sh "llmtivo[all]==$VERSION"

      - name: Verify package import and version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PY'
          import os, llmtivo
          expected = os.environ["VERSION"]
          assert llmtivo.__version__ == expected, f"{llmtivo.__version__} != {expected}"
          print("llmtivo version:", llmtivo.__version__)
          PY

      # LLMTivo ships NO console script, so there is no CLI to smoke. Its real packaging risk is the
      # pytest11 ENTRY POINT: if that is wrong the plugin silently fails to load, the `llmtivo`
      # fixture goes missing, and every suite depending on it errors — from a wheel that imported
      # perfectly. This is the check worth having.
      - name: Verify the pytest plugin auto-registers from the installed wheel
        # Behavioural, not textual: a test that REQUESTS the fixture errors if the plugin did not
        # load. (Grepping `--trace-config` for "llmtivo" looks equivalent and is not — it matches
        # the install PATH on every line, so it passes even with the entry point removed.)
        run: |
          mkdir -p /tmp/ep-check && cd /tmp/ep-check
          cat > test_plugin_loads.py <<'EOF'
          def test_the_llmtivo_fixture_is_available(llmtivo):
              assert llmtivo is not None
          EOF
          python -m pytest test_plugin_loads.py -q -p no:cacheprovider
          echo "✅ pytest11 entry point registers and the fixture resolves"

      - name: Verify both integration seams import
        run: |
          python -c "from llmtivo.litellm import patched_litellm; print('✅ litellm seam')"
          python -c "from llmtivo.langchain import patched_langchain; print('✅ langchain seam')"

      - name: Install test dependencies
        run: uv sync --group dev --group integration

      - name: Reinstall package from Test PyPI (overwrite editable install)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: scripts/pip_install_retry.sh "llmtivo==$VERSION" --force-reinstall --no-deps

      - name: Run the suite against the published package
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          uv run pytest tests/ -v
          echo "✅ Suite passed against the Test PyPI build"
